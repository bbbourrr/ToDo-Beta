<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./ToDo.css">
    <title>ToDo App</title>
</head>
<body>

    <div class="container">
    <h1>To-Do</h1>

    <form id="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="Enter a new task..."
        autocomplete="off"
        required
      >
      <button type="submit">Add</button>
    </form>

    <p id="task-count">0 tasks remaining</p>

    <ul id="task-list"></ul>

    <button id="clear-btn" type="button">
      Clear All Tasks
    </button>
  </div>

    <script src="./ToDo.js"></script>
</body>
</html>
